    <script>
        // ================================================================

        let scene, camera, renderer, droneGroup, propellers = [];
        let gridHelper, trajectoryLine;
        
        // Расширенное состояние дрона с реалистичной физикой
        const droneState = {
            // Позиция
            x: 0, y: 0, z: 0,
            // Скорость
            vx: 0, vy: 0, vz: 0,
            // Целевая позиция

            // Физические параметры
            mass: 1.5, // кг

            dragCoefficient: 0.3,

            battery: 100,
            batteryDrainRate: 0.5, // % в секунду при полёте
            // Путь
            path: [],
            // Вращение пропеллеров
            propAngle: 0,
            propSpeed: 0,
            // Время
            time: 0,
            // Для PID
            pidIntegral: 0,

        };

        // Миссии с шаблонами кода
        const missions = {

        // Инициализация Three.js
        function initThreeJS() {
            const container = document.getElementById('drone3DContainer');
            const width = container.clientWidth;
            const height = container.clientHeight;
            
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0e27);
            scene.fog = new THREE.Fog(0x0a0e27, 20, 50);
            
            camera = new THREE.PerspectiveCamera(60, width / height, 0.1, 100);
            camera.position.set(8, 6, 8);
            camera.lookAt(0, 2, 0);
            
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(width, height);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);
            
            // Освещение
            const ambientLight = new THREE.AmbientLight(0x404060, 0.6);
            scene.add(ambientLight);
            
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(10, 20, 10);
            directionalLight.castShadow = true;
            directionalLight.shadow.mapSize.width = 2048;
            directionalLight.shadow.mapSize.height = 2048;
            scene.add(directionalLight);
            
            // Сетка
            gridHelper = new THREE.GridHelper(20, 20, 0x4f46e5, 0x334155);
            gridHelper.position.y = 0;
            scene.add(gridHelper);
            
            // Создание дрона
            createBeautifulDrone();
            
            // Траектория
            const trajectoryGeometry = new THREE.BufferGeometry();
            const trajectoryMaterial = new THREE.LineBasicMaterial({ 
                color: 0x00ff88, 
                transparent: true, 
                opacity: 0.5 
            });
            trajectoryLine = new THREE.Line(trajectoryGeometry, trajectoryMaterial);
            scene.add(trajectoryLine);
            
            // Ресайз
            window.addEventListener('resize', () => {
                const w = container.clientWidth;
                const h = container.clientHeight;
                camera.aspect = w / h;
                camera.updateProjectionMatrix();
                renderer.setSize(w, h);
            });
        }

        function createBeautifulDrone() {
            droneGroup = new THREE.Group();
            
            // Корпус
            const bodyGeometry = new THREE.BoxGeometry(0.7, 0.12, 0.7);
            const bodyMaterial = new THREE.MeshPhongMaterial({ 
                color: 0x4f46e5, 
                metalness: 0.4, 
                roughness: 0.6 
            });
            const body = new THREE.Mesh(bodyGeometry, bodyMaterial);
            body.castShadow = true;
            droneGroup.add(body);
            
            // Лучи
            const armGeometry = new THREE.CylinderGeometry(0.04, 0.06, 0.9, 8);
            const armMaterial = new THREE.MeshPhongMaterial({ 
                color: 0x64748b, 
                metalness: 0.6, 
                roughness: 0.4 
            });
            
            const positions = [
                { x: 0.4, z: 0.4, rot: Math.PI / 4 },
                { x: -0.4, z: 0.4, rot: -Math.PI / 4 },
                { x: -0.4, z: -0.4, rot: Math.PI / 4 },
                { x: 0.4, z: -0.4, rot: -Math.PI / 4 }
            ];
            
            positions.forEach(pos => {
                const arm = new THREE.Mesh(armGeometry, armMaterial);
                arm.position.set(pos.x, 0, pos.z);
                arm.rotation.z = pos.rot;
                droneGroup.add(arm);
            });
            
            // Моторы и пропеллеры
            const motorPositions = [
                { x: 0.75, z: 0.75 },
                { x: -0.75, z: 0.75 },
                { x: -0.75, z: -0.75 },
                { x: 0.75, z: -0.75 }
            ];
            
            motorPositions.forEach(pos => {
                const motor = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.09, 0.09, 0.08, 16),
                    new THREE.MeshPhongMaterial({ color: 0x334155 })
                );
                motor.position.set(pos.x, 0.06, pos.z);
                droneGroup.add(motor);
                
                const prop = new THREE.Mesh(
                    new THREE.BoxGeometry(0.55, 0.015, 0.12),
                    new THREE.MeshPhongMaterial({ color: 0x94a3b8 })
                );
                prop.position.set(pos.x, 0.12, pos.z);
                propellers.push(prop);
                droneGroup.add(prop);
            });
            
            scene.add(droneGroup);
        }

        // Реалистичная физика полёта
        function updatePhysics(dt) {
            if (!droneState.flying && !droneState.hovering) return;
            
            // PID-регулятор для каждой оси
            const kp = 2.0;
            const ki = 0.5;
            const kd = 1.0;
            
            // Ошибки по осям
            const errorX = droneState.targetX - droneState.x;
            const errorY = droneState.targetY - droneState.y;
            const errorZ = droneState.targetZ - droneState.z;
            
            // Интегральные составляющие
            droneState.pidIntegral += (errorX + errorY + errorZ) * dt;
            droneState.pidIntegral = Math.max(-2, Math.min(2, droneState.pidIntegral));
            
            // Ускорения от PID
            const accelX = kp * errorX + ki * droneState.pidIntegral + kd * (errorX - droneState.lastError.x) / dt;
            const accelY = kp * errorY + ki * droneState.pidIntegral + kd * (errorY - droneState.lastError.y) / dt;
            const accelZ = kp * errorZ + ki * droneState.pidIntegral + kd * (errorZ - droneState.lastError.z) / dt;
            
            // Ограничение ускорения
            const maxAccel = droneState.maxAcceleration;
            const accelMag = Math.sqrt(accelX * accelX + accelY * accelY + accelZ * accelZ);
            if (accelMag > maxAccel) {
                const scale = maxAccel / accelMag;
                accelX *= scale;
                accelY *= scale;
                accelZ *= scale;
            }
            
            // Обновление скорости
            droneState.vx += accelX * dt;
            droneState.vy += accelY * dt;
            droneState.vz += accelZ * dt;
            
            // Аэродинамическое сопротивление
            const drag = droneState.dragCoefficient;
            droneState.vx *= (1 - drag * dt);
            droneState.vy *= (1 - drag * dt);
            droneState.vz *= (1 - drag * dt);
            
            // Ограничение скорости
            const speed = Math.sqrt(droneState.vx * droneState.vx + droneState.vy * droneState.vy + droneState.vz * droneState.vz);
            if (speed > droneState.maxSpeed) {
                const scale = droneState.maxSpeed / speed;
                droneState.vx *= scale;
                droneState.vy *= scale;
                droneState.vz *= scale;
            }
            
            // Обновление позиции
            droneState.x += droneState.vx * dt;
            droneState.y += droneState.vy * dt;
            droneState.z += droneState.vz * dt;
            
            // Ограничение высоты
            if (droneState.y < 0) {
                droneState.y = 0;
                droneState.vy = 0;
            }
            
            // Обновление lastError
            droneState.lastError.x = errorX;
            droneState.lastError.y = errorY;
            droneState.lastError.z = errorZ;
            
            // Разряд батареи
            if (droneState.flying || droneState.hovering) {
                droneState.battery -= droneState.batteryDrainRate * dt;
                if (droneState.battery < 0) droneState.battery = 0;
            }
            
            // Скорость пропеллеров зависит от вертикальной скорости
            droneState.propSpeed = Math.abs(droneState.vy) * 5 + (droneState.flying ? 10 : 0);
            droneState.propAngle += droneState.propSpeed * dt;
            
            // Обновление времени
            droneState.time += dt;
        }

        // Парсер кода с поддержкой циклов
        function parseCode(code) {
            const commands = [];
            const lines = code.split('\n');
            let inFunction = false;
            
            for (let i = 0; i < lines.length; i++) {
                const line = lines[i];
                const trimmed = line.trim();
                
                if (trimmed.includes('def on_start')) {
                    inFunction = true;
                    continue;
                }
                
                if (!inFunction) continue;
                
                // Обработка циклов
                if (trimmed.startsWith('for ')) {
                    const forMatch = trimmed.match(/for\s+\w+\s+in\s+range\((\d+)\)/);
                    if (forMatch) {
                        const count = parseInt(forMatch[1]);
                        const bodyCommands = [];
                        i++; // Переходим к телу цикла
                        
                        while (i < lines.length) {
                            const bodyLine = lines[i];
                            const bodyTrimmed = bodyLine.trim();
                            
                            // Проверяем, не вышли ли из цикла
                            if (bodyTrimmed === '' || bodyTrimmed.startsWith('#')) {
                                i++;
                                continue;
                            }
                            
                            // Если строка с меньшим отступом - вышли из цикла
                            const indent = bodyLine.length - bodyTrimmed.length;
                            if (indent <= 4 && bodyTrimmed !== '') {
                                i--;
                                break;
                            }
                            
                            // Парсим команду в теле цикла
                            if (bodyTrimmed.startsWith('drone.')) {
                                const match = bodyTrimmed.match(/drone\.(\w+)\(([^)]*)\)/);
                                if (match) {
                                    const cmd = match[1];
                                    const args = match[2].split(',').map(a => {
                                        a = a.trim();
                                        if (a === '') return 0;
                                        // Поддержка математических выражений
                                        try {
                                            return eval(a.replace(/math\./g, 'Math.'));
                                        } catch {
                                            return parseFloat(a) || 0;
                                        }
                                    });
                                    bodyCommands.push({ cmd, args });
                                }
                            }
                            
                            i++;
                        }
                        
                        // Разворачиваем цикл
                        for (let j = 0; j < count; j++) {
                            commands.push(...bodyCommands);
                        }
                    }
                }
                
                // Обычные команды
                if (trimmed.startsWith('drone.')) {
                    const match = trimmed.match(/drone\.(\w+)\(([^)]*)\)/);
                    if (match) {
                        const cmd = match[1];
                        const args = match[2].split(',').map(a => {
                            a = a.trim();
                            if (a === '') return 0;
                            try {
                                return eval(a.replace(/math\./g, 'Math.'));
                            } catch {
                                return parseFloat(a) || 0;
                            }
                        });
                        commands.push({ cmd, args });
                    }
                }
            }
            
            return commands;
        }

        // Выполнение команд с анимацией
        async function executeCommands(commands) {
            for (let i = 0; i < commands.length; i++) {
                const command = commands[i];
                
                switch (command.cmd) {
                    case 'takeoff':
                        const height = command.args[0] || 3;
                        droneState.targetY = height;
                        droneState.flying = true;
                        droneState.hovering = true;
                        document.getElementById('telStatus').textContent = 'Взлёт';
                        document.getElementById('telStatus').style.color = '#00ff88';
                        addLog(`🛫 Взлёт на ${height} м`, 'success');
                        await waitForAltitude(height);
                        break;
                        
                    case 'land':
                        droneState.targetY = 0;
                        droneState.flying = false;
                        droneState.hovering = false;
                        document.getElementById('telStatus').textContent = 'Посадка';
                        document.getElementById('telStatus').style.color = '#ff9f43';
                        addLog('🛬 Посадка', 'info');
                        await waitForAltitude(0);
                        break;
                        
                    case 'hover':
                        const seconds = command.args[0] || 2;
                        droneState.hovering = true;
                        document.getElementById('telStatus').textContent = 'Зависание';
                        document.getElementById('telStatus').style.color = '#6bcfff';
                        addLog(`⏳ Зависание на ${seconds} с`, 'info');
                        await new Promise(resolve => setTimeout(resolve, seconds * 1000));
                        break;
                        
                    case 'go_to':
                        const x = command.args[0] || 0;
                        const z = command.args[1] || 0;
                        const y = command.args[2] || droneState.y;
                        droneState.targetX = x;
                        droneState.targetZ = z;
                        droneState.targetY = y;
                        droneState.flying = true;
                        document.getElementById('telStatus').textContent = 'Полёт';
                        document.getElementById('telStatus').style.color = '#ffd93d';
                        addLog(`🎯 Перемещение к (${x.toFixed(1)}, ${z.toFixed(1)}, ${y.toFixed(1)})`, 'info');
                        await waitForPosition(x, z, y);
                        break;
                }
            }
            
            addLog('✅ Программа завершена', 'success');
            document.getElementById('telStatus').textContent = 'Завершено';
            document.getElementById('telStatus').style.color = '#10b981';
        }

        // Вспомогательные функции ожидания
        function waitForAltitude(targetAlt) {
            return new Promise(resolve => {
                const checkInterval = setInterval(() => {
                    if (Math.abs(droneState.y - targetAlt) < 0.1) {
                        clearInterval(checkInterval);
                        resolve();
                    }
                }, 100);
            });
        }

        function waitForPosition(targetX, targetZ, targetY) {
            return new Promise(resolve => {
                const checkInterval = setInterval(() => {
                    const dx = Math.abs(droneState.x - targetX);
                    const dz = Math.abs(droneState.z - targetZ);
                    const dy = Math.abs(droneState.y - targetY);
                    
                    if (dx < 0.15 && dz < 0.15 && dy < 0.15) {
                        clearInterval(checkInterval);
                        resolve();
                    }
                }, 100);
            });
        }

        // Анимация
        function animate() {
            requestAnimationFrame(animate);
            
            const dt = 0.016; // ~60 FPS
            updatePhysics(dt);
            
            // Обновление 3D позиции
            droneGroup.position.set(droneState.x, droneState.y, droneState.z);
            
            // Вращение пропеллеров
            propellers.forEach(prop => {
                prop.rotation.y = droneState.propAngle;
            });
            
            // Траектория
            if (droneState.flying || droneState.hovering) {
                droneState.path.push({ x: droneState.x, y: droneState.y, z: droneState.z });
                if (droneState.path.length > 500) droneState.path.shift();
                
                const points = droneState.path.map(p => new THREE.Vector3(p.x, p.y, p.z));
                trajectoryLine.geometry.dispose();
                trajectoryLine.geometry = new THREE.BufferGeometry().setFromPoints(points);
            }
            
            // Камера
            camera.position.x = droneState.x + 6;
            camera.position.y = droneState.y + 4;
            camera.position.z = droneState.z + 6;
            camera.lookAt(droneGroup.position);
            
            // Телеметрия
            const speed = Math.sqrt(droneState.vx * droneState.vx + droneState.vy * droneState.vy + droneState.vz * droneState.vz);
            document.getElementById('telAltitude').textContent = droneState.y.toFixed(1) + ' м';
            document.getElementById('telX').textContent = droneState.x.toFixed(1) + ' м';
            document.getElementById('telY').textContent = droneState.z.toFixed(1) + ' м';
            document.getElementById('telSpeed').textContent = speed.toFixed(1) + ' м/с';
            document.getElementById('telBattery').textContent = droneState.battery.toFixed(0) + '%';
            
            renderer.render(scene, camera);
        }

        // Обработчики
        document.getElementById('btnRun').addEventListener('click', async () => {
            const code = document.getElementById('codeEditor').value;
            const commands = parseCode(code);
            
            if (commands.length === 0) {
                addLog('❌ Ошибка: команды не найдены', 'error');
                return;
            }
            
            addLog(`🚀 Запуск программы (${commands.length} команд)`, 'info');
            await executeCommands(commands);
        });

        document.getElementById('btnReset').addEventListener('click', resetSimulation);
        
        document.getElementById('btnStop').addEventListener('click', () => {
            droneState.flying = false;
            droneState.hovering = false;
            droneState.targetX = droneState.x;
            droneState.targetY = droneState.y;
            droneState.targetZ = droneState.z;
            addLog('⏹ Симуляция остановлена', 'warning');
        });

        function resetSimulation() {
            droneState.x = 0;
            droneState.y = 0;
            droneState.z = 0;
            droneState.vx = 0;
            droneState.vy = 0;
            droneState.vz = 0;
            droneState.targetX = 0;
            droneState.targetY = 0;
            droneState.targetZ = 0;
            droneState.flying = false;
            droneState.hovering = false;
            droneState.battery = 100;
            droneState.path = [];
            droneState.pidIntegral = 0;
            droneState.lastError = { x: 0, y: 0, z: 0 };
            
            document.getElementById('telAltitude').textContent = '0.0 м';
            document.getElementById('telX').textContent = '0.0 м';
            document.getElementById('telY').textContent = '0.0 м';
            document.getElementById('telSpeed').textContent = '0.0 м/с';
            document.getElementById('telBattery').textContent = '100%';
            document.getElementById('telStatus').textContent = 'Готов';
            document.getElementById('telStatus').style.color = '#a5b4fc';
            
            addLog('🔄 Симуляция сброшена', 'info');
        }

        function addLog(message, type = 'info') {
            const consoleDiv = document.getElementById('logConsole');
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            const now = new Date();
            entry.innerHTML = `<span class="log-timestamp">[${now.toLocaleTimeString()}]</span><span class="log-${type}">${message}</span>`;
            consoleDiv.appendChild(entry);
            consoleDiv.scrollTop = consoleDiv.scrollHeight;
        }

        // Выбор миссии
        document.querySelectorAll('.task-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.task-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                
                const missionName = btn.dataset.mission;
                const mission = missions[missionName];
                
                if (mission) {
                    document.getElementById('missionDescription').textContent = mission.description;
                    document.getElementById('codeEditor').value = mission.template;
                    resetSimulation();
                    addLog(`📌 Загружена миссия: ${mission.name}`, 'info');
                }
            });
        });

        // Инициализация
        window.addEventListener('load', () => {
            setTimeout(() => {
                document.getElementById('preloader').classList.add('hidden');
            }, 500);
            
            initThreeJS();
            animate();
        });
    </script>
</body>
</html>
