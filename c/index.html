<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Канал в ThunderLight</title>
    <meta name="theme-color" content="#020617">
    <link rel="icon" type="image/x-icon" href="/logocircle.ico">
    <link rel="stylesheet" href="/link.css">
    <script defer src="/link.js"></script>
</head>
<body>
<div class="card" id="link-root" data-type="c">
    <div class="logo">⚡</div>
    <h1 id="link-title">Открываем канал</h1>
    <p class="subtitle" id="link-subtitle">Если ThunderLight установлен, ссылка откроется в приложении.</p>
    <div class="target" id="link-target"></div>
    <a id="link-open" class="btn btn-primary" href="#">Открыть в приложении</a>
    <a id="link-download" class="btn btn-secondary" href="/download/">Скачать ThunderLight</a>
    <div class="status" id="link-status"></div>
    <p class="hint">
        Если приложение не установлено, мы автоматически откроем страницу загрузки.
        На Android разрешите открытие ссылок в ThunderLight.
    </p>
</div>
</body>
</html>
