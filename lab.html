<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ThunderLight — Профессиональный Симулятор БПЛА</title>
    <link rel="icon" type="image/x-icon" href="/logocircle.ico">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --primary: #4f46e5;
            --secondary: #7c3aed;
            --accent: #06b6d4;
            --dark: #0f172a;
            --darker: #020617;
            --light: #f8fafc;
            --gray: #64748b;
            --gray-light: #94a3b8;
            --border: rgba(255, 255, 255, 0.08);
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --radius: 16px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        
        body {
            font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
            line-height: 1.7;
            color: var(--light);
            background: var(--darker);
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }
        
        .preloader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--darker);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.5s, visibility 0.5s;
        }
        .preloader.hidden { opacity: 0; visibility: hidden; }
        
        .navbar {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(2, 6, 23, 0.85);
            backdrop-filter: blur(24px) saturate(180%);
            z-index: 1000;
            border-bottom: 1px solid var(--border);
        }
        
        .simulator-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 100px 20px 40px;
            display: grid;
            grid-template-columns: 1fr 380px;
            gap: 20px;
        }
        
        .visualization-panel {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            position: relative;
        }
        
        .canvas-container {
            position: relative;
            width: 100%;
            height: 650px;
            background: linear-gradient(180deg, #0a0e27 0%, #1a1a3e 40%, #2d1b4e 70%, #1a0f2a 100%);
            overflow: hidden;
        }
        
        #simCanvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        
        /* HUD - улучшенный */
        .hud-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            display: flex;
            gap: 15px;
            pointer-events: none;
            z-index: 10;
        }
        
        .hud-box {
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            padding: 12px 18px;
            backdrop-filter: blur(10px);
            min-width: 130px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }
        
        .hud-label {
            font-size: 0.7em;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }
        
        .hud-value {
            font-size: 1.4em;
            font-weight: 700;
            font-family: 'Courier New', monospace;
            color: #00ff88;
            text-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
        }
        
        .control-panel {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        .panel-section {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 12px;
            padding: 18px;
        }
        
        .panel-section h3 {
            font-size: 1em;
            font-weight: 700;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #a5b4fc;
        }
        
        .slider-group {
            margin-bottom: 18px;
        }
        
        .slider-group label {
            display: flex;
            justify-content: space-between;
            font-size: 0.85em;
            color: #94a3b8;
            margin-bottom: 8px;
        }
        
        .slider-group input[type="range"] {
            width: 100%;
            height: 6px;
            -webkit-appearance: none;
            background: linear-gradient(90deg, #4f46e5, #7c3aed);
            border-radius: 3px;
            outline: none;
        }
        
        .slider-group input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: white;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(79, 70, 229, 0.6);
            transition: all 0.2s;
        }
        
        .slider-group input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }
        
        .btn {
            padding: 12px 24px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.9em;
            border: none;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            letter-spacing: 1px;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(16, 185, 129, 0.5);
        }
        
        .btn-warning {
            background: rgba(245, 158, 11, 0.2);
            color: #f59e0b;
        }
        
        .btn-danger {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
        }
        
        .telemetry-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        
        .telemetry-item {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            padding: 12px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        .telemetry-value {
            font-size: 1.1em;
            font-weight: 700;
            font-family: 'Courier New', monospace;
            margin-bottom: 4px;
        }
        
        .telemetry-label {
            font-size: 0.7em;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .chart-container {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            padding: 10px;
            position: relative;
        }
        
        #chartCanvas {
            width: 100%;
            height: 150px;
            display: block;
        }
        
        .status-indicator {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            padding: 12px 18px;
            z-index: 10;
            text-align: center;
        }
        
        @media (max-width: 1024px) {
            .simulator-container {
                grid-template-columns: 1fr;
            }
        }
        
        @media (max-width: 768px) {
            .simulator-container {
                padding: 80px 10px 20px;
            }
            
            .canvas-container {
                height: 400px;
            }
            
            .hud-overlay {
                flex-direction: column;
                gap: 10px;
            }
            
            .hud-box {
                min-width: 100px;
                padding: 8px 12px;
            }
        }
        
        @keyframes spin { 
            to { transform: rotate(360deg); } 
        }
    </style>
</head>
<body>
    <div class="preloader" id="preloader">
        <div style="text-align: center;">
            <span style="font-size: 3em; font-weight: 900; background: linear-gradient(135deg, #818cf8, #c084fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">⚡ ThunderLight</span>
            <div style="width: 40px; height: 40px; margin: 20px auto; border: 3px solid rgba(255,255,255,0.1); border-top-color: #4f46e5; border-radius: 50%; animation: spin 0.8s linear infinite;"></div>
        </div>
    </div>

    <nav class="navbar">
        <div style="max-width: 1400px; margin: 0 auto; padding: 16px 20px; display: flex; justify-content: space-between; align-items: center;">
            <a href="/" style="font-size: 1.5em; font-weight: 800; background: linear-gradient(135deg, #818cf8, #c084fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-decoration: none;">⚡ ThunderLight</a>
            <div style="display: flex; gap: 20px; align-items: center;">
                <a href="/" style="color: #94a3b8; text-decoration: none;">Главная</a>
                <a href="/projects.html" style="color: #94a3b8; text-decoration: none;">Проекты</a>
                <a href="/articles.html" style="color: #94a3b8; text-decoration: none;">Статьи</a>
                <a href="/lab.html" style="color: white; text-decoration: none; background: rgba(79, 70, 229, 0.2); padding: 8px 16px; border-radius: 8px;">Симулятор</a>
            </div>
        </div>
    </nav>

    <div class="simulator-container">
        <div class="visualization-panel">
            <div class="canvas-container">
                <canvas id="simCanvas"></canvas>
                
                <div class="hud-overlay">
                    <div class="hud-box">
                        <div class="hud-label">Высота</div>
                        <div class="hud-value" id="hudAltitude">0.0 м</div>
                    </div>
                    <div class="hud-box">
                        <div class="hud-label">Скорость</div>
                        <div class="hud-value" id="hudSpeed">0.0 м/с</div>
                    </div>
                    <div class="hud-box">
                        <div class="hud-label">Вертикальная</div>
                        <div class="hud-value" id="hudVertical" style="color: #6bcfff;">0.0 м/с</div>
                    </div>
                </div>
                
                <div class="status-indicator">
                    <div style="font-size: 0.7em; color: #94a3b8; text-transform: uppercase; margin-bottom: 4px;">Режим</div>
                    <div style="font-size: 1.1em; font-weight: 700;" id="modeIndicator">ГОТОВ</div>
                </div>
            </div>
        </div>

        <div class="control-panel">
            <div class="panel-section">
                <h3>🎛️ Параметры полёта</h3>
                
                <div class="slider-group">
                    <label>Горизонтальная скорость <span id="speedVal" style="color: #00ff88;">15 м/с</span></label>
                    <input type="range" id="speedSlider" min="5" max="30" value="15" step="0.5">
                </div>
                
                <div class="slider-group">
                    <label>Угол атаки <span id="aoaVal" style="color: #00ff88;">5°</span></label>
                    <input type="range" id="aoaSlider" min="-5" max="15" value="5" step="0.5">
                </div>
                
                <div class="slider-group">
                    <label>Масса <span id="massVal" style="color: #00ff88;">850 г</span></label>
                    <input type="range" id="massSlider" min="500" max="1200" value="850" step="10">
                </div>
                
                <div class="slider-group">
                    <label>Тяга двигателя <span id="thrustVal" style="color: #00ff88;">50%</span></label>
                    <input type="range" id="thrustSlider" min="0" max="100" value="50" step="1">
                </div>
            </div>

            <div class="panel-section">
                <h3>🎮 Управление</h3>
                <div style="display: grid; gap: 10px;">
                    <button class="btn btn-primary" id="btnRun">▶ ЗАПУСК</button>
                    <button class="btn btn-warning" id="btnPause">⏸ ПАУЗА</button>
                    <button class="btn btn-danger" id="btnReset">⟳ СБРОС</button>
                </div>
            </div>

            <div class="panel-section">
                <h3>📊 Телеметрия</h3>
                <div class="telemetry-grid">
                    <div class="telemetry-item">
                        <div class="telemetry-value" id="telLift" style="color: #00ff88;">0 Н</div>
                        <div class="telemetry-label">Подъёмная</div>
                    </div>
                    <div class="telemetry-item">
                        <div class="telemetry-value" id="telDrag" style="color: #ff6b6b;">0 Н</div>
                        <div class="telemetry-label">Лобовое</div>
                    </div>
                    <div class="telemetry-item">
                        <div class="telemetry-value" id="telThrust" style="color: #ffd93d;">0 Н</div>
                        <div class="telemetry-label">Тяга</div>
                    </div>
                    <div class="telemetry-item">
                        <div class="telemetry-value" id="telWeight" style="color: #ff9f43;">0 Н</div>
                        <div class="telemetry-label">Вес</div>
                    </div>
                </div>
            </div>

            <div class="panel-section">
                <h3>📈 Профиль полёта</h3>
                <div class="chart-container">
                    <canvas id="chartCanvas"></canvas>
                </div>
                <div style="display: flex; justify-content: space-between; margin-top: 5px; font-size: 0.7em; color: #94a3b8;">
                    <span>Высота (м)</span>
                    <span>Время (с)</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        class FlightSimulator {
            constructor() {
                this.canvas = document.getElementById('simCanvas');
                this.ctx = this.canvas.getContext('2d');
                this.chartCanvas = document.getElementById('chartCanvas');
                this.chartCtx = this.chartCanvas.getContext('2d');
                
                this.params = {
                    speed: 15,
                    aoa: 5,
                    mass: 850,
                    thrust: 50
                };
                
                this.state = {
                    altitude: 0,
                    verticalVelocity: 0,
                    pitch: 0,
                    time: 0,
                    running: false,
                    paused: false,
                    history: [],
                    lift: 0,
                    drag: 0,
                    thrust: 0,
                    weight: 0
                };
                
                this.constants = {
                    g: 9.81,
                    rho: 1.225,
                    wingArea: 0.4,
                    timeScale: 0.3 // Замедление времени для наглядности
                };
                
                this.lastTimestamp = 0;
                this.init();
            }
            
            init() {
                this.resizeCanvas();
                this.setupEventListeners();
                this.animate();
            }
            
            resizeCanvas() {
                const container = this.canvas.parentElement;
                this.canvas.width = container.clientWidth;
                this.canvas.height = container.clientHeight;
                
                this.chartCanvas.width = this.chartCanvas.parentElement.clientWidth;
                this.chartCanvas.height = 150;
            }
            
            setupEventListeners() {
                document.getElementById('btnRun').addEventListener('click', () => this.toggleRun());
                document.getElementById('btnPause').addEventListener('click', () => this.togglePause());
                document.getElementById('btnReset').addEventListener('click', () => this.reset());
                
                const sliders = [
                    { id: 'speedSlider', valId: 'speedVal', param: 'speed', unit: ' м/с' },
                    { id: 'aoaSlider', valId: 'aoaVal', param: 'aoa', unit: '°' },
                    { id: 'massSlider', valId: 'massVal', param: 'mass', unit: ' г' },
                    { id: 'thrustSlider', valId: 'thrustVal', param: 'thrust', unit: '%' }
                ];
                
                sliders.forEach(({ id, valId, param, unit }) => {
                    const slider = document.getElementById(id);
                    slider.addEventListener('input', () => {
                        this.params[param] = parseFloat(slider.value);
                        document.getElementById(valId).textContent = slider.value + unit;
                    });
                });
                
                window.addEventListener('resize', () => this.resizeCanvas());
            }
            
            toggleRun() {
                if (!this.state.running) {
                    this.state.running = true;
                    this.state.paused = false;
                    document.getElementById('btnRun').textContent = '⏹ ОСТАНОВИТЬ';
                    document.getElementById('modeIndicator').textContent = 'ПОЛЁТ';
                    document.getElementById('modeIndicator').style.color = '#00ff88';
                    
                    if (this.state.history.length === 0) {
                        this.state.altitude = 1;
                        this.state.verticalVelocity = 0;
                        this.state.pitch = 0;
                    }
                } else {
                    this.state.running = false;
                    document.getElementById('btnRun').textContent = '▶ ЗАПУСК';
                    document.getElementById('modeIndicator').textContent = 'ГОТОВ';
                    document.getElementById('modeIndicator').style.color = '#94a3b8';
                }
            }
            
            togglePause() {
                if (this.state.running) {
                    this.state.paused = !this.state.paused;
                    document.getElementById('btnPause').textContent = this.state.paused ? '▶ ПРОДОЛЖИТЬ' : '⏸ ПАУЗА';
                    document.getElementById('modeIndicator').textContent = this.state.paused ? 'ПАУЗА' : 'ПОЛЁТ';
                    document.getElementById('modeIndicator').style.color = this.state.paused ? '#ffd93d' : '#00ff88';
                }
            }
            
            reset() {
                this.state = {
                    altitude: 0,
                    verticalVelocity: 0,
                    pitch: 0,
                    time: 0,
                    running: false,
                    paused: false,
                    history: [],
                    lift: 0,
                    drag: 0,
                    thrust: 0,
                    weight: 0
                };
                
                document.getElementById('btnRun').textContent = '▶ ЗАПУСК';
                document.getElementById('btnPause').textContent = '⏸ ПАУЗА';
                document.getElementById('modeIndicator').textContent = 'ГОТОВ';
                document.getElementById('modeIndicator').style.color = '#94a3b8';
                
                this.updateDisplays();
            }
            
            updatePhysics(dt) {
                const { g, rho, wingArea, timeScale } = this.constants;
                const mass = this.params.mass / 1000;
                const speed = this.params.speed;
                const aoaRad = this.params.aoa * Math.PI / 180;
                const thrustPercent = this.params.thrust / 100;
                
                // Аэродинамические коэффициенты
                const cl = 1.2 * Math.sin(2 * aoaRad); // Более реалистичная модель
                const cd = 0.03 + 0.05 * Math.abs(aoaRad);
                
                // Силы
                this.state.lift = 0.5 * rho * speed * speed * wingArea * cl;
                this.state.drag = 0.5 * rho * speed * speed * wingArea * cd;
                this.state.weight = mass * g;
                this.state.thrust = thrustPercent * this.state.weight * 2; // Максимальная тяга = 2x веса
                
                // Вертикальное ускорение
                const netForce = this.state.lift + this.state.thrust * Math.sin(aoaRad) - this.state.weight;
                const acceleration = netForce / mass;
                
                // Интеграция с замедлением времени
                this.state.verticalVelocity += acceleration * dt * timeScale;
                this.state.altitude += this.state.verticalVelocity * dt * timeScale;
                
                // Ограничения
                if (this.state.altitude < 0) {
                    this.state.altitude = 0;
                    if (this.state.verticalVelocity < 0) this.state.verticalVelocity = 0;
                }
                
                // Угол тангажа
                const targetPitch = this.params.aoa * 0.6;
                this.state.pitch += (targetPitch - this.state.pitch) * dt * 3;
                this.state.pitch = Math.max(-20, Math.min(20, this.state.pitch));
                
                // История для графика
                this.state.history.push({
                    altitude: this.state.altitude,
                    time: this.state.time,
                    verticalVelocity: this.state.verticalVelocity,
                    lift: this.state.lift
                });
                
                if (this.state.history.length > 300) {
                    this.state.history.shift();
                }
                
                this.state.time += dt * timeScale;
            }
            
            draw() {
                const { ctx, canvas, state } = this;
                const W = canvas.width;
                const H = canvas.height;
                
                // Очистка
                ctx.clearRect(0, 0, W, H);
                
                // Небо с градиентом
                const skyGrad = ctx.createLinearGradient(0, 0, 0, H);
                skyGrad.addColorStop(0, '#0a0e27');
                skyGrad.addColorStop(0.4, '#1a1a3e');
                skyGrad.addColorStop(0.7, '#2d1b4e');
                skyGrad.addColorStop(1, '#3d2b5e');
                ctx.fillStyle = skyGrad;
                ctx.fillRect(0, 0, W, H);
                
                // Облака (движутся медленно)
                this.drawClouds(W, H);
                
                // Земля (движется вниз при наборе высоты)
                const groundOffset = state.altitude * 5;
                const groundY = H * 0.7 + groundOffset;
                
                // Ограничиваем, чтобы земля не уходила слишком далеко
                const maxGroundY = Math.min(groundY, H * 0.95);
                
                // Земля
                const groundGrad = ctx.createLinearGradient(0, maxGroundY, 0, H);
                groundGrad.addColorStop(0, '#2d5a27');
                groundGrad.addColorStop(1, '#1a3a1a');
                ctx.fillStyle = groundGrad;
                ctx.fillRect(0, maxGroundY, W, H - maxGroundY);
                
                // Линия горизонта
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(0, maxGroundY);
                ctx.lineTo(W, maxGroundY);
                ctx.stroke();
                
                // Трава/деревья на земле
                if (maxGroundY < H) {
                    ctx.fillStyle = 'rgba(34, 197, 94, 0.3)';
                    for (let i = 0; i < W; i += 20) {
                        const treeHeight = 5 + Math.sin(i * 0.3) * 3;
                        ctx.fillRect(i, maxGroundY - treeHeight, 2, treeHeight);
                    }
                }
                
                // Самолёт (всегда в центре, с учётом высоты)
                const planeX = W * 0.5;
                const planeY = H * 0.4 - Math.min(state.altitude * 0.5, 100); // Самолёт поднимается вверх при наборе высоты
                
                this.drawAirplane(planeX, planeY, state.pitch);
                
                // Векторы сил
                if (state.running && !state.paused) {
                    this.drawForceVectors(planeX, planeY);
                }
                
                // Шкала высоты справа
                this.drawAltitudeScale(W, H);
            }
            
            drawClouds(W, H) {
                const { ctx, state } = this;
                ctx.fillStyle = 'rgba(255, 255, 255, 0.05)';
                
                for (let i = 0; i < 5; i++) {
                    const x = (i * 200 + state.time * 2) % (W + 100) - 50;
                    const y = 50 + i * 50 + Math.sin(i * 2 + state.time) * 20;
                    
                    ctx.beginPath();
                    ctx.arc(x, y, 30 + i * 5, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(x + 25, y + 5, 25 + i * 3, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(x - 20, y + 8, 20 + i * 2, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
            
            drawAirplane(x, y, pitch) {
                const { ctx, state } = this;
                
                ctx.save();
                ctx.translate(x, y);
                ctx.rotate(pitch * Math.PI / 180);
                
                // Масштаб самолёта
                const scale = 1.2;
                ctx.scale(scale, scale);
                
                // Тень
                ctx.shadowColor = 'rgba(0, 0, 0, 0.5)';
                ctx.shadowBlur = 20;
                ctx.shadowOffsetX = 5;
                ctx.shadowOffsetY = 5;
                
                // Фюзеляж - более реалистичная форма
                ctx.beginPath();
                ctx.moveTo(50, 0); // Нос
                ctx.quadraticCurveTo(60, -6, 40, -12); // Верх носа
                ctx.lineTo(-30, -10); // Верх фюзеляжа
                ctx.quadraticCurveTo(-45, -8, -50, -3); // Хвост верх
                ctx.lineTo(-50, 3); // Хвост низ
                ctx.quadraticCurveTo(-45, 8, -30, 10); // Низ хвоста
                ctx.lineTo(40, 12); // Низ фюзеляжа
                ctx.quadraticCurveTo(60, 6, 50, 0); // Низ носа
                ctx.closePath();
                
                // Градиент фюзеляжа
                const fuselageGrad = ctx.createLinearGradient(-50, 0, 60, 0);
                fuselageGrad.addColorStop(0, '#475569');
                fuselageGrad.addColorStop(0.3, '#64748b');
                fuselageGrad.addColorStop(0.7, '#94a3b8');
                fuselageGrad.addColorStop(1, '#cbd5e1');
                ctx.fillStyle = fuselageGrad;
                ctx.fill();
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
                ctx.lineWidth = 1;
                ctx.stroke();
                
                // Крылья - более реалистичные
                ctx.shadowBlur = 15;
                ctx.shadowOffsetX = 3;
                ctx.shadowOffsetY = 3;
                
                // Правое крыло
                ctx.beginPath();
                ctx.moveTo(10, -5); // Корень крыла
                ctx.quadraticCurveTo(5, -40, -25, -45); // Верхняя кромка
                ctx.lineTo(-35, -38); // Законцовка
                ctx.quadraticCurveTo(-15, -15, -10, -8); // Нижняя кромка
                ctx.closePath();
                
                const wingGrad = ctx.createLinearGradient(10, -45, -35, -5);
                wingGrad.addColorStop(0, '#4f46e5');
                wingGrad.addColorStop(1, '#7c3aed');
                ctx.fillStyle = wingGrad;
                ctx.fill();
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
                ctx.lineWidth = 0.5;
                ctx.stroke();
                
                // Левое крыло (зеркально)
                ctx.beginPath();
                ctx.moveTo(10, 5);
                ctx.quadraticCurveTo(5, 40, -25, 45);
                ctx.lineTo(-35, 38);
                ctx.quadraticCurveTo(-15, 15, -10, 8);
                ctx.closePath();
                
                const wingGrad2 = ctx.createLinearGradient(10, 45, -35, 5);
                wingGrad2.addColorStop(0, '#4f46e5');
                wingGrad2.addColorStop(1, '#7c3aed');
                ctx.fillStyle = wingGrad2;
                ctx.fill();
                ctx.stroke();
                
                // Хвостовое оперение
                ctx.shadowBlur = 10;
                
                // Вертикальный стабилизатор
                ctx.beginPath();
                ctx.moveTo(-35, -3);
                ctx.quadraticCurveTo(-40, -25, -48, -22);
                ctx.lineTo(-50, -15);
                ctx.quadraticCurveTo(-42, -8, -38, -4);
                ctx.closePath();
                
                const tailGrad = ctx.createLinearGradient(-35, -25, -50, 0);
                tailGrad.addColorStop(0, '#7c3aed');
                tailGrad.addColorStop(1, '#a855f7');
                ctx.fillStyle = tailGrad;
                ctx.fill();
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
                ctx.lineWidth = 0.5;
                ctx.stroke();
                
                // Горизонтальный стабилизатор
                ctx.beginPath();
                ctx.moveTo(-38, -2);
                ctx.quadraticCurveTo(-45, -12, -52, -10);
                ctx.lineTo(-53, -7);
                ctx.quadraticCurveTo(-46, -5, -40, -1);
                ctx.closePath();
                ctx.fillStyle = '#6b7280';
                ctx.fill();
                ctx.stroke();
                
                // Кабина пилота
                ctx.shadowBlur = 20;
                ctx.shadowColor = 'rgba(6, 182, 212, 0.3)';
                
                ctx.beginPath();
                ctx.moveTo(25, -4);
                ctx.quadraticCurveTo(35, -10, 42, -6);
                ctx.quadraticCurveTo(40, -2, 35, 0);
                ctx.quadraticCurveTo(28, 0, 25, 2);
                ctx.closePath();
                
                const cockpitGrad = ctx.createLinearGradient(25, -10, 42, 0);
                cockpitGrad.addColorStop(0, '#06b6d4');
                cockpitGrad.addColorStop(1, '#0891b2');
                ctx.fillStyle = cockpitGrad;
                ctx.fill();
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
                ctx.lineWidth = 0.5;
                ctx.stroke();
                
                // Пропеллер
                ctx.shadowBlur = 10;
                ctx.shadowColor = 'rgba(255, 255, 255, 0.2)';
                
                if (state.running && !state.paused) {
                    const propAngle = state.time * 20;
                    ctx.save();
                    ctx.translate(52, 0);
                    ctx.rotate(propAngle);
                    
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
                    ctx.beginPath();
                    ctx.ellipse(0, 0, 15, 2, 0, 0, Math.PI * 2);
                    ctx.fill();
                    
                    ctx.beginPath();
                    ctx.ellipse(0, 0, 2, 15, 0, 0, Math.PI * 2);
                    ctx.fill();
                    
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
                    ctx.beginPath();
                    ctx.arc(0, 0, 3, 0, Math.PI * 2);
                    ctx.fill();
                    
                    ctx.restore();
                } else {
                    // Неподвижный пропеллер
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
                    ctx.beginPath();
                    ctx.ellipse(52, 0, 12, 2, 0, 0, Math.PI * 2);
                    ctx.fill();
                }
                
                // Сброс тени
                ctx.shadowBlur = 0;
                ctx.shadowOffsetX = 0;
                ctx.shadowOffsetY = 0;
                
                ctx.restore();
            }
            
            drawForceVectors(x, y) {
                const { ctx, state } = this;
                const scale = 3;
                
                // Подъёмная сила (зелёная стрелка вверх)
                if (state.lift > 0.1) {
                    ctx.strokeStyle = '#00ff88';
                    ctx.lineWidth = 3;
                    ctx.setLineDash([5, 5]);
                    ctx.beginPath();
                    ctx.moveTo(x - 30, y);
                    ctx.lineTo(x - 30, y - state.lift * scale);
                    ctx.stroke();
                    
                    // Наконечник стрелки
                    ctx.fillStyle = '#00ff88';
                    ctx.beginPath();
                    ctx.moveTo(x - 35, y - state.lift * scale);
                    ctx.lineTo(x - 25, y - state.lift * scale);
                    ctx.lineTo(x - 30, y - state.lift * scale - 10);
                    ctx.closePath();
                    ctx.fill();
                    
                    ctx.fillStyle = '#00ff88';
                    ctx.font = '10px Arial';
                    ctx.fillText('Lift', x - 45, y - state.lift * scale / 2);
                }
                
                // Вес (красная стрелка вниз)
                ctx.strokeStyle = '#ff6b6b';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(x + 30, y);
                ctx.lineTo(x + 30, y + state.weight * scale);
                ctx.stroke();
                
                // Наконечник стрелки
                ctx.fillStyle = '#ff6b6b';
                ctx.beginPath();
                ctx.moveTo(x + 25, y + state.weight * scale);
                ctx.lineTo(x + 35, y + state.weight * scale);
                ctx.lineTo(x + 30, y + state.weight * scale + 10);
                ctx.closePath();
                ctx.fill();
                
                ctx.fillStyle = '#ff6b6b';
                ctx.font = '10px Arial';
                ctx.fillText('Weight', x + 40, y + state.weight * scale / 2);
                
                // Тяга (жёлтая стрелка вправо)
                ctx.strokeStyle = '#ffd93d';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(x + 50, y);
                ctx.lineTo(x + 50 + state.thrust * scale, y);
                ctx.stroke();
                
                ctx.setLineDash([]);
            }
            
            drawAltitudeScale(W, H) {
                const { ctx, state } = this;
                
                // Шкала высоты
                const scaleX = W - 30;
                const scaleTop = 50;
                const scaleBottom = H - 50;
                const scaleHeight = scaleBottom - scaleTop;
                
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(scaleX, scaleTop);
                ctx.lineTo(scaleX, scaleBottom);
                ctx.stroke();
                
                // Метки
                const maxDisplayAlt = 20;
                const numMarks = 10;
                
                for (let i = 0; i <= numMarks; i++) {
                    const alt = (i / numMarks) * maxDisplayAlt;
                    const y = scaleBottom - (alt / maxDisplayAlt) * scaleHeight;
                    
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
                    ctx.beginPath();
                    ctx.moveTo(scaleX - 5, y);
                    ctx.lineTo(scaleX, y);
                    ctx.stroke();
                    
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
                    ctx.font = '9px Arial';
                    ctx.fillText(alt.toFixed(0), scaleX - 25, y + 3);
                }
                
                // Текущая высота
                if (state.altitude <= maxDisplayAlt) {
                    const currentY = scaleBottom - (state.altitude / maxDisplayAlt) * scaleHeight;
                    
                    ctx.fillStyle = '#00ff88';
                    ctx.beginPath();
                    ctx.arc(scaleX, currentY, 5, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
            
            drawChart() {
                const { chartCtx, chartCanvas, state } = this;
                const W = chartCanvas.width;
                const H = chartCanvas.height;
                
                chartCtx.clearRect(0, 0, W, H);
                
                if (state.history.length < 2) return;
                
                // Сетка
                chartCtx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
                chartCtx.lineWidth = 1;
                for (let i = 0; i < 5; i++) {
                    const y = (i / 4) * H;
                    chartCtx.beginPath();
                    chartCtx.moveTo(0, y);
                    chartCtx.lineTo(W, y);
                    chartCtx.stroke();
                }
                
                // График высоты
                const maxAlt = Math.max(...state.history.map(d => d.altitude), 1) * 1.2;
                
                // Заливка под графиком
                chartCtx.beginPath();
                state.history.forEach((d, i) => {
                    const x = (i / (state.history.length - 1)) * W;
                    const y = H - (d.altitude / maxAlt) * (H - 20) - 10;
                    
                    if (i === 0) {
                        chartCtx.moveTo(x, y);
                    } else {
                        chartCtx.lineTo(x, y);
                    }
                });
                chartCtx.lineTo(W, H);
                chartCtx.lineTo(0, H);
                chartCtx.closePath();
                
                const fillGrad = chartCtx.createLinearGradient(0, 0, 0, H);
                fillGrad.addColorStop(0, 'rgba(0, 255, 136, 0.3)');
                fillGrad.addColorStop(1, 'rgba(0, 255, 136, 0.02)');
                chartCtx.fillStyle = fillGrad;
                chartCtx.fill();
                
                // Линия графика
                chartCtx.strokeStyle = '#00ff88';
                chartCtx.lineWidth = 2;
                chartCtx.beginPath();
                state.history.forEach((d, i) => {
                    const x = (i / (state.history.length - 1)) * W;
                    const y = H - (d.altitude / maxAlt) * (H - 20) - 10;
                    
                    if (i === 0) {
                        chartCtx.moveTo(x, y);
                    } else {
                        chartCtx.lineTo(x, y);
                    }
                });
                chartCtx.stroke();
                
                // Текущая точка
                const lastData = state.history[state.history.length - 1];
                const lastX = W - 1;
                const lastY = H - (lastData.altitude / maxAlt) * (H - 20) - 10;
                
                chartCtx.fillStyle = '#00ff88';
                chartCtx.beginPath();
                chartCtx.arc(lastX, lastY, 4, 0, Math.PI * 2);
                chartCtx.fill();
                
                // Метки
                chartCtx.fillStyle = 'rgba(255, 255, 255, 0.5)';
                chartCtx.font = '9px Arial';
                chartCtx.fillText(`${maxAlt.toFixed(1)} м`, 5, 12);
                chartCtx.fillText('0 м', 5, H - 5);
                chartCtx.fillText(`${state.time.toFixed(1)} с`, W - 30, H - 5);
            }
            
            updateDisplays() {
                document.getElementById('hudAltitude').textContent = this.state.altitude.toFixed(1) + ' м';
                document.getElementById('hudSpeed').textContent = this.params.speed.toFixed(1) + ' м/с';
                document.getElementById('hudVertical').textContent = this.state.verticalVelocity.toFixed(1) + ' м/с';
                
                document.getElementById('telLift').textContent = this.state.lift.toFixed(1) + ' Н';
                document.getElementById('telDrag').textContent = this.state.drag.toFixed(1) + ' Н';
                document.getElementById('telThrust').textContent = this.state.thrust.toFixed(1) + ' Н';
                document.getElementById('telWeight').textContent = this.state.weight.toFixed(1) + ' Н';
            }
            
            animate() {
                const loop = (timestamp) => {
                    if (this.lastTimestamp === 0) {
                        this.lastTimestamp = timestamp;
                    }
                    
                    const dt = (timestamp - this.lastTimestamp) / 1000;
                    this.lastTimestamp = timestamp;
                    
                    if (this.state.running && !this.state.paused) {
                        this.updatePhysics(dt);
                    }
                    
                    this.draw();
                    this.drawChart();
                    this.updateDisplays();
                    
                    requestAnimationFrame(loop);
                };
                
                requestAnimationFrame(loop);
            }
        }
        
        window.addEventListener('load', () => {
            setTimeout(() => {
                document.getElementById('preloader').classList.add('hidden');
            }, 500);
            
            const simulator = new FlightSimulator();
        });
    </script>
