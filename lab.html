<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ThunderLight — Профессиональный Симулятор БПЛА</title>
    <link rel="icon" type="image/x-icon" href="/logocircle.ico">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --secondary: #7c3aed;
            --accent: #06b6d4;
            --dark: #0f172a;
            --darker: #020617;
            --light: #f8fafc;
            --gray: #64748b;
            --gray-light: #94a3b8;
            --border: rgba(255, 255, 255, 0.08);
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --radius: 16px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        
        body {
            font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
            line-height: 1.7;
            color: var(--light);
            background: var(--darker);
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }
        
        /* Прелоадер */
        .preloader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--darker);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.5s, visibility 0.5s;
        }
        .preloader.hidden { opacity: 0; visibility: hidden; }
        
        /* Навигация */
        .navbar {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(2, 6, 23, 0.85);
            backdrop-filter: blur(24px) saturate(180%);
            z-index: 1000;
            border-bottom: 1px solid var(--border);
            transition: var(--transition);
        }
        
        /* Основной контейнер симулятора */
        .simulator-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 100px 20px 40px;
            display: grid;
            grid-template-columns: 1fr 340px;
            gap: 20px;
        }
        
        /* Панель визуализации */
        .visualization-panel {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            position: relative;
        }
        
        .canvas-container {
            position: relative;
            width: 100%;
            height: 600px;
            background: linear-gradient(180deg, #0a0e27 0%, #1a1a3e 50%, #2d1b4e 100%);
        }
        
        #simCanvas {
            width: 100%;
            height: 100%;
            display: block;
            cursor: crosshair;
        }
        
        /* HUD оверлей */
        .hud-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            display: flex;
            gap: 15px;
            pointer-events: none;
        }
        
        .hud-box {
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 10px 15px;
            backdrop-filter: blur(10px);
            min-width: 120px;
        }
        
        .hud-label {
            font-size: 0.7em;
            color: var(--gray-light);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 2px;
        }
        
        .hud-value {
            font-size: 1.3em;
            font-weight: 700;
            font-family: 'Courier New', monospace;
            color: #00ff88;
            text-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
        }
        
        /* Панель управления */
        .control-panel {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        .panel-section {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 12px;
            padding: 15px;
        }
        
        .panel-section h3 {
            font-size: 0.9em;
            font-weight: 700;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #a5b4fc;
        }
        
        /* Слайдеры */
        .slider-group {
            margin-bottom: 15px;
        }
        
        .slider-group label {
            display: flex;
            justify-content: space-between;
            font-size: 0.85em;
            color: var(--gray-light);
            margin-bottom: 5px;
        }
        
        .slider-group input[type="range"] {
            width: 100%;
            height: 6px;
            -webkit-appearance: none;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            border-radius: 3px;
            outline: none;
        }
        
        .slider-group input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: white;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(79, 70, 229, 0.5);
        }
        
        /* Кнопки */
        .btn {
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.85em;
            border: none;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            width: 100%;
            justify-content: center;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(79, 70, 229, 0.4);
        }
        
        /* График */
        .chart-container {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            padding: 10px;
            position: relative;
        }
        
        #chartCanvas {
            width: 100%;
            height: 150px;
            display: block;
        }
        
        /* Телеметрия */
        .telemetry-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        
        .telemetry-item {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            padding: 10px;
            text-align: center;
        }
        
        .telemetry-value {
            font-size: 1.2em;
            font-weight: 700;
            font-family: 'Courier New', monospace;
        }
        
        .telemetry-label {
            font-size: 0.7em;
            color: var(--gray-light);
            text-transform: uppercase;
        }
        
        /* Адаптивность */
        @media (max-width: 1024px) {
            .simulator-container {
                grid-template-columns: 1fr;
            }
        }
        
        @media (max-width: 768px) {
            .simulator-container {
                padding: 80px 10px 20px;
            }
            
            .canvas-container {
                height: 400px;
            }
        }
    </style>
</head>
<body>
    <!-- Прелоадер -->
    <div class="preloader" id="preloader">
        <div style="text-align: center;">
            <span style="font-size: 3em; font-weight: 900; background: linear-gradient(135deg, #818cf8, #c084fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">⚡ ThunderLight</span>
            <div style="width: 40px; height: 40px; margin: 20px auto; border: 3px solid rgba(255,255,255,0.1); border-top-color: #4f46e5; border-radius: 50%; animation: spin 0.8s linear infinite;"></div>
        </div>
    </div>
    
    <style>
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>

    <!-- Навигация -->
    <nav class="navbar">
        <div style="max-width: 1400px; margin: 0 auto; padding: 16px 20px; display: flex; justify-content: space-between; align-items: center;">
            <a href="/" style="font-size: 1.5em; font-weight: 800; background: linear-gradient(135deg, #818cf8, #c084fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-decoration: none;">⚡ ThunderLight</a>
            <div style="display: flex; gap: 20px; align-items: center;">
                <a href="/" style="color: #94a3b8; text-decoration: none;">Главная</a>
                <a href="/projects.html" style="color: #94a3b8; text-decoration: none;">Проекты</a>
                <a href="/articles.html" style="color: #94a3b8; text-decoration: none;">Статьи</a>
                <a href="/lab.html" style="color: white; text-decoration: none; background: rgba(79, 70, 229, 0.2); padding: 8px 16px; border-radius: 8px;">Симулятор</a>
            </div>
        </div>
    </nav>

    <!-- Основной контейнер -->
    <div class="simulator-container">
        <!-- Визуализация -->
        <div class="visualization-panel">
            <div class="canvas-container">
                <canvas id="simCanvas"></canvas>
                
                <!-- HUD -->
                <div class="hud-overlay">
                    <div class="hud-box">
                        <div class="hud-label">Высота</div>
                        <div class="hud-value" id="hudAltitude">0.0 м</div>
                    </div>
                    <div class="hud-box">
                        <div class="hud-label">Скорость</div>
                        <div class="hud-value" id="hudSpeed">0.0 м/с</div>
                    </div>
                    <div class="hud-box">
                        <div class="hud-label">Тангаж</div>
                        <div class="hud-value" id="hudPitch">0.0°</div>
                    </div>
                </div>
                
                <!-- Индикатор режима -->
                <div style="position: absolute; top: 20px; right: 20px; background: rgba(0,0,0,0.7); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 10px 15px;">
                    <div style="font-size: 0.7em; color: #94a3b8; text-transform: uppercase;">Режим</div>
                    <div style="font-size: 1em; font-weight: 700;" id="modeIndicator">ГОТОВ</div>
                </div>
            </div>
        </div>

        <!-- Панель управления -->
        <div class="control-panel">
            <!-- Параметры полёта -->
            <div class="panel-section">
                <h3>🎛️ Параметры полёта</h3>
                
                <div class="slider-group">
                    <label>Скорость <span id="speedVal" style="color: #00ff88;">18 м/с</span></label>
                    <input type="range" id="speedSlider" min="5" max="40" value="18" step="0.5">
                </div>
                
                <div class="slider-group">
                    <label>Угол атаки <span id="aoaVal" style="color: #00ff88;">4°</span></label>
                    <input type="range" id="aoaSlider" min="-5" max="20" value="4" step="0.5">
                </div>
                
                <div class="slider-group">
                    <label>Масса <span id="massVal" style="color: #00ff88;">850 г</span></label>
                    <input type="range" id="massSlider" min="300" max="1500" value="850" step="10">
                </div>
                
                <div class="slider-group">
                    <label>Центр тяжести <span id="cgVal" style="color: #00ff88;">32%</span></label>
                    <input type="range" id="cgSlider" min="20" max="45" value="32" step="0.5">
                </div>
                
                <div class="slider-group">
                    <label>Ветер <span id="windVal" style="color: #00ff88;">0 м/с</span></label>
                    <input type="range" id="windSlider" min="-10" max="10" value="0" step="0.5">
                </div>
            </div>

            <!-- Управление -->
            <div class="panel-section">
                <h3>🎮 Управление</h3>
                <div style="display: grid; gap: 10px;">
                    <button class="btn btn-primary" id="btnRun">▶ ЗАПУСК</button>
                    <button class="btn" id="btnPause" style="background: rgba(245, 158, 11, 0.2); color: #f59e0b;">⏸ ПАУЗА</button>
                    <button class="btn" id="btnReset" style="background: rgba(239, 68, 68, 0.2); color: #ef4444;">⟳ СБРОС</button>
                </div>
            </div>

            <!-- Телеметрия -->
            <div class="panel-section">
                <h3>📊 Телеметрия</h3>
                <div class="telemetry-grid">
                    <div class="telemetry-item">
                        <div class="telemetry-value" id="telLift" style="color: #00ff88;">0 Н</div>
                        <div class="telemetry-label">Подъёмная сила</div>
                    </div>
                    <div class="telemetry-item">
                        <div class="telemetry-value" id="telDrag" style="color: #ff6b6b;">0 Н</div>
                        <div class="telemetry-label">Сопротивление</div>
                    </div>
                    <div class="telemetry-item">
                        <div class="telemetry-value" id="telThrust" style="color: #ffd93d;">0 Н</div>
                        <div class="telemetry-label">Тяга</div>
                    </div>
                    <div class="telemetry-item">
                        <div class="telemetry-value" id="telAccel" style="color: #6bcfff;">0 м/с²</div>
                        <div class="telemetry-label">Ускорение</div>
                    </div>
                </div>
            </div>

            <!-- График -->
            <div class="panel-section">
                <h3>📈 Профиль полёта</h3>
                <div class="chart-container">
                    <canvas id="chartCanvas"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ============================================
        // ПРОФЕССИОНАЛЬНЫЙ СИМУЛЯТОР БПЛА
        // ============================================

        class FlightSimulator {
            constructor() {
                this.canvas = document.getElementById('simCanvas');
                this.ctx = this.canvas.getContext('2d');
                this.chartCanvas = document.getElementById('chartCanvas');
                this.chartCtx = this.chartCanvas.getContext('2d');
                
                // Параметры
                this.params = {
                    speed: 18,
                    aoa: 4,
                    mass: 850,
                    cg: 32,
                    wind: 0
                };
                
                // Состояние
                this.state = {
                    altitude: 0,
                    velocity: 0,
                    acceleration: 0,
                    pitch: 0,
                    time: 0,
                    running: false,
                    paused: false,
                    history: [],
                    lift: 0,
                    drag: 0,
                    thrust: 0,
                    weight: 0,
                    cameraOffset: 0
                };
                
                // Физические константы
                this.constants = {
                    g: 9.81,
                    rho: 1.225,
                    wingArea: 0.5,
                    clMax: 1.5,
                    cd0: 0.04,
                    k: 0.08
                };
                
                this.init();
            }
            
            init() {
                this.resizeCanvas();
                this.setupEventListeners();
                this.animate();
            }
            
            resizeCanvas() {
                const container = this.canvas.parentElement;
                this.canvas.width = container.clientWidth;
                this.canvas.height = container.clientHeight;
                
                this.chartCanvas.width = this.chartCanvas.parentElement.clientWidth;
                this.chartCanvas.height = 150;
            }
            
            setupEventListeners() {
                // Кнопки
                document.getElementById('btnRun').addEventListener('click', () => this.toggleRun());
                document.getElementById('btnPause').addEventListener('click', () => this.togglePause());
                document.getElementById('btnReset').addEventListener('click', () => this.reset());
                
                // Слайдеры
                const sliders = [
                    { id: 'speedSlider', valId: 'speedVal', param: 'speed', unit: ' м/с' },
                    { id: 'aoaSlider', valId: 'aoaVal', param: 'aoa', unit: '°' },
                    { id: 'massSlider', valId: 'massVal', param: 'mass', unit: ' г' },
                    { id: 'cgSlider', valId: 'cgVal', param: 'cg', unit: '%' },
                    { id: 'windSlider', valId: 'windVal', param: 'wind', unit: ' м/с' }
                ];
                
                sliders.forEach(({ id, valId, param, unit }) => {
                    const slider = document.getElementById(id);
                    slider.addEventListener('input', () => {
                        this.params[param] = parseFloat(slider.value);
                        document.getElementById(valId).textContent = slider.value + unit;
                    });
                });
                
                // Ресайз
                window.addEventListener('resize', () => this.resizeCanvas());
            }
            
            toggleRun() {
                if (!this.state.running) {
                    this.state.running = true;
                    this.state.paused = false;
                    document.getElementById('btnRun').textContent = '⏹ ОСТАНОВИТЬ';
                    document.getElementById('modeIndicator').textContent = 'ПОЛЁТ';
                    document.getElementById('modeIndicator').style.color = '#00ff88';
                    
                    if (this.state.history.length === 0) {
                        this.state.altitude = 0.5;
                        this.state.velocity = 0;
                    }
                } else {
                    this.state.running = false;
                    document.getElementById('btnRun').textContent = '▶ ЗАПУСК';
                    document.getElementById('modeIndicator').textContent = 'ГОТОВ';
                    document.getElementById('modeIndicator').style.color = '#94a3b8';
                }
            }
            
            togglePause() {
                if (this.state.running) {
                    this.state.paused = !this.state.paused;
                    document.getElementById('btnPause').textContent = this.state.paused ? '▶ ПРОДОЛЖИТЬ' : '⏸ ПАУЗА';
                    document.getElementById('modeIndicator').textContent = this.state.paused ? 'ПАУЗА' : 'ПОЛЁТ';
                    document.getElementById('modeIndicator').style.color = this.state.paused ? '#ffd93d' : '#00ff88';
                }
            }
            
            reset() {
                this.state = {
                    altitude: 0,
                    velocity: 0,
                    acceleration: 0,
                    pitch: 0,
                    time: 0,
                    running: false,
                    paused: false,
                    history: [],
                    lift: 0,
                    drag: 0,
                    thrust: 0,
                    weight: 0,
                    cameraOffset: 0
                };
                
                document.getElementById('btnRun').textContent = '▶ ЗАПУСК';
                document.getElementById('btnPause').textContent = '⏸ ПАУЗА';
                document.getElementById('modeIndicator').textContent = 'ГОТОВ';
                document.getElementById('modeIndicator').style.color = '#94a3b8';
                
                this.updateDisplays();
            }
            
            updatePhysics(dt) {
                const { g, rho, wingArea, clMax, cd0, k } = this.constants;
                const mass = this.params.mass / 1000; // в кг
                const speed = this.params.speed + this.params.wind;
                const aoaRad = this.params.aoa * Math.PI / 180;
                
                // Аэродинамические коэффициенты
                const cl = Math.min(2 * Math.PI * aoaRad, clMax);
                const cd = cd0 + k * Math.abs(aoaRad);
                
                // Силы
                this.state.lift = 0.5 * rho * speed * speed * wingArea * cl;
                this.state.drag = 0.5 * rho * speed * speed * wingArea * cd;
                this.state.weight = mass * g;
                this.state.thrust = this.state.drag + 0.15 * this.state.weight;
                
                // Ускорение
                const netForce = this.state.lift - this.state.weight;
                this.state.acceleration = netForce / mass;
                
                // Интеграция
                this.state.velocity += this.state.acceleration * dt;
                this.state.altitude += this.state.velocity * dt;
                
                // Ограничения
                if (this.state.altitude < 0) {
                    this.state.altitude = 0;
                    if (this.state.velocity < 0) this.state.velocity = 0;
                }
                
                // Угол тангажа
                const cg = this.params.cg / 100;
                const targetPitch = this.params.aoa * 0.7 + (cg - 0.32) * 30;
                this.state.pitch += (targetPitch - this.state.pitch) * dt * 2;
                this.state.pitch = Math.max(-30, Math.min(30, this.state.pitch));
                
                // История
                this.state.history.push({
                    altitude: this.state.altitude,
                    time: this.state.time,
                    pitch: this.state.pitch,
                    lift: this.state.lift,
                    velocity: this.state.velocity
                });
                
                if (this.state.history.length > 200) {
                    this.state.history.shift();
                }
                
                this.state.time += dt;
            }
            
            draw() {
                const { ctx, canvas, state } = this;
                const W = canvas.width;
                const H = canvas.height;
                
                // Очистка
                ctx.clearRect(0, 0, W, H);
                
                // Небо
                const skyGrad = ctx.createLinearGradient(0, 0, 0, H);
                skyGrad.addColorStop(0, '#0a0e27');
                skyGrad.addColorStop(0.3, '#1a1a3e');
                skyGrad.addColorStop(0.6, '#2d1b4e');
                skyGrad.addColorStop(1, '#1a0f2a');
                ctx.fillStyle = skyGrad;
                ctx.fillRect(0, 0, W, H);
                
                // Звёзды
                if (state.altitude > 10) {
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
                    for (let i = 0; i < 20; i++) {
                        const x = (i * 137) % W;
                        const y = (i * 89) % (H * 0.5);
                        ctx.fillRect(x, y, 1, 1);
                    }
                }
                
                // Обновление камеры
                const targetCameraOffset = -state.altitude * 3;
                state.cameraOffset += (targetCameraOffset - state.cameraOffset) * 0.1;
                
                // Земля
                const groundY = H * 0.75 + state.cameraOffset;
                ctx.fillStyle = 'rgba(34, 197, 94, 0.15)';
                ctx.fillRect(0, groundY, W, H - groundY);
                
                // Горизонт
                ctx.strokeStyle = 'rgba(34, 197, 94, 0.3)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(0, groundY);
                ctx.lineTo(W, groundY);
                ctx.stroke();
                
                // Самолёт
                const planeX = W / 2;
                const planeY = H / 2;
                this.drawAirplane(planeX, planeY, state.pitch);
                
                // Векторы сил
                if (state.running && !state.paused) {
                    this.drawForceVectors(planeX, planeY);
                }
                
                // Индикаторы на канвасе
                this.drawCanvasIndicators();
            }
            
            drawAirplane(x, y, pitch) {
                const { ctx } = this;
                
                ctx.save();
                ctx.translate(x, y);
                ctx.rotate(pitch * Math.PI / 180);
                
                // Фюзеляж
                ctx.beginPath();
                ctx.moveTo(60, 0);
                ctx.quadraticCurveTo(80, -8, 70, -12);
                ctx.lineTo(-40, -9);
                ctx.lineTo(-50, -2);
                ctx.lineTo(-50, 2);
                ctx.lineTo(-40, 9);
                ctx.lineTo(70, 12);
                ctx.quadraticCurveTo(80, 8, 60, 0);
                ctx.closePath();
                
                const fuselageGrad = ctx.createLinearGradient(-50, 0, 80, 0);
                fuselageGrad.addColorStop(0, '#64748b');
                fuselageGrad.addColorStop(0.5, '#94a3b8');
                fuselageGrad.addColorStop(1, '#64748b');
                ctx.fillStyle = fuselageGrad;
                ctx.fill();
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
                ctx.lineWidth = 1;
                ctx.stroke();
                
                // Крылья
                ctx.fillStyle = '#4f46e5';
                ctx.beginPath();
                ctx.moveTo(10, -5);
                ctx.quadraticCurveTo(0, -50, -30, -45);
                ctx.lineTo(-38, -38);
                ctx.lineTo(-10, -8);
                ctx.closePath();
                ctx.fill();
                
                ctx.beginPath();
                ctx.moveTo(10, 5);
                ctx.quadraticCurveTo(0, 50, -30, 45);
                ctx.lineTo(-38, 38);
                ctx.lineTo(-10, 8);
                ctx.closePath();
                ctx.fill();
                
                // Хвост
                ctx.fillStyle = '#7c3aed';
                ctx.beginPath();
                ctx.moveTo(-40, -2);
                ctx.lineTo(-55, -20);
                ctx.lineTo(-50, -17);
                ctx.lineTo(-42, -3);
                ctx.closePath();
                ctx.fill();
                
                ctx.beginPath();
                ctx.moveTo(-40, 2);
                ctx.lineTo(-55, 20);
                ctx.lineTo(-50, 17);
                ctx.lineTo(-42, 3);
                ctx.closePath();
                ctx.fill();
                
                // Кабина
                ctx.fillStyle = '#06b6d4';
                ctx.beginPath();
                ctx.ellipse(35, 0, 15, 6, 0, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.restore();
            }
            
            drawForceVectors(x, y) {
                const { ctx, state } = this;
                const scale = 2;
                
                // Подъёмная сила
                ctx.strokeStyle = '#00ff88';
                ctx.lineWidth = 2;
                ctx.setLineDash([5, 5]);
                ctx.beginPath();
                ctx.moveTo(x + 30, y);
                ctx.lineTo(x + 30, y - state.lift * scale);
                ctx.stroke();
                ctx.setLineDash([]);
                
                // Вес
                ctx.strokeStyle = '#ff6b6b';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(x - 30, y);
                ctx.lineTo(x - 30, y + state.weight * scale);
                ctx.stroke();
                
                // Тяга
                ctx.strokeStyle = '#ffd93d';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(x + 50, y);
                ctx.lineTo(x + 50 + state.thrust * scale, y);
                ctx.stroke();
            }
            
            drawCanvasIndicators() {
                const { ctx, canvas } = this;
                
                ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
                ctx.fillRect(10, 10, 200, 80);
                
                ctx.fillStyle = '#00ff88';
                ctx.font = '12px monospace';
                ctx.fillText(`Высота: ${this.state.altitude.toFixed(1)} м`, 20, 30);
                ctx.fillText(`Скорость: ${(this.params.speed + this.params.wind).toFixed(1)} м/с`, 20, 50);
                ctx.fillText(`Тангаж: ${this.state.pitch.toFixed(1)}°`, 20, 70);
            }
            
            drawChart() {
                const { chartCtx, chartCanvas, state } = this;
                const W = chartCanvas.width;
                const H = chartCanvas.height;
                
                chartCtx.clearRect(0, 0, W, H);
                
                if (state.history.length < 2) return;
                
                // Сетка
                chartCtx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
                chartCtx.lineWidth = 1;
                for (let i = 0; i < 5; i++) {
                    const y = (i / 4) * H;
                    chartCtx.beginPath();
                    chartCtx.moveTo(0, y);
                    chartCtx.lineTo(W, y);
                    chartCtx.stroke();
                }
                
                // График высоты
                const maxAlt = Math.max(...state.history.map(d => d.altitude)) * 1.1;
                
                chartCtx.strokeStyle = '#00ff88';
                chartCtx.lineWidth = 2;
                chartCtx.beginPath();
                
                state.history.forEach((d, i) => {
                    const x = (i / (state.history.length - 1)) * W;
                    const y = H - (d.altitude / maxAlt) * (H - 20) - 10;
                    
                    if (i === 0) {
                        chartCtx.moveTo(x, y);
                    } else {
                        chartCtx.lineTo(x, y);
                    }
                });
                
                chartCtx.stroke();
                
                // Заполнение
                chartCtx.lineTo(W, H);
                chartCtx.lineTo(0, H);
                chartCtx.closePath();
                chartCtx.fillStyle = 'rgba(0, 255, 136, 0.1)';
                chartCtx.fill();
                
                // Метки
                chartCtx.fillStyle = '#94a3b8';
                chartCtx.font = '10px monospace';
                chartCtx.fillText(`${maxAlt.toFixed(1)} м`, 5, 15);
                chartCtx.fillText('0 м', 5, H - 5);
            }
            
            updateDisplays() {
                // HUD
                document.getElementById('hudAltitude').textContent = this.state.altitude.toFixed(1) + ' м';
                document.getElementById('hudSpeed').textContent = (this.params.speed + this.params.wind).toFixed(1) + ' м/с';
                document.getElementById('hudPitch').textContent = this.state.pitch.toFixed(1) + '°';
                
                // Телеметрия
                document.getElementById('telLift').textContent = this.state.lift.toFixed(1) + ' Н';
                document.getElementById('telDrag').textContent = this.state.drag.toFixed(1) + ' Н';
                document.getElementById('telThrust').textContent = this.state.thrust.toFixed(1) + ' Н';
                document.getElementById('telAccel').textContent = this.state.acceleration.toFixed(2) + ' м/с²';
            }
            
            animate() {
                const loop = (timestamp) => {
                    if (this.state.running && !this.state.paused) {
                        const dt = 0.016; // ~60 FPS
                        this.updatePhysics(dt);
                    }
                    
                    this.draw();
                    this.drawChart();
                    this.updateDisplays();
                    
                    requestAnimationFrame(loop);
                };
                
                requestAnimationFrame(loop);
            }
        }
        
        // Инициализация
        window.addEventListener('load', () => {
            setTimeout(() => {
                document.getElementById('preloader').classList.add('hidden');
            }, 500);
            
            const simulator = new FlightSimulator();
        });
    </script>
</body>
</html>
